[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icfa"
version = "1.0.0"
description = "Intervention-Constrained Feedback Admission: four gates between evaluation feedback and a prompt optimizer"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
gepa = ["gepa @ git+https://github.com/gepa-ai/gepa@15ee314f9c7d34ec153b809d401f42f55c4dcd76"]

[tool.setuptools.packages.find]
where = ["src"]
